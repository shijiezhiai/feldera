apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "compiler.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "compiler.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  serviceName: {{ include "compiler.fullname" . }}
  replicas: {{ .Values.parallelCompilation.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "compiler.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "compiler.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "compiler.fullname" . }}
      containers:
        - name: compiler
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # P1-005 skeleton: idle until the manager -> compiler HTTP remote
          # compile path is wired in P1-018.
          command: ["sleep", "infinity"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: workspace
              mountPath: /home/ubuntu/.feldera/compiler
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ include "compiler.fullname" . }}
