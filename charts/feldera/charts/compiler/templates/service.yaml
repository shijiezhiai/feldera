apiVersion: v1
kind: Service
metadata:
  name: {{ include "compiler.fullname" . }}
  labels:
    {{- include "compiler.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "compiler.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: compiler
      port: {{ .Values.compilerPort }}
      targetPort: {{ .Values.compilerPort }}
