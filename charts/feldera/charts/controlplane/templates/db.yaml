{{- if not .Values.postgresExternal }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-db
  labels:
    {{- include "controlplane.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-db
  replicas: 1
  # See the compiler StatefulSet: `OnDelete` (the default) leaves the old pod
  # running while Helm reports the new image, which is how a `postgres:16` pod
  # survived an upgrade to `postgres:17` and kept failing to pull.
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with .Values.labels.controlPlane }}
        {{- include "controlplane.pairsToMap" . | nindent 8 }}
        {{- end }}
      {{- with .Values.annotations.controlPlane }}
      annotations:
        {{- include "controlplane.pairsToMap" . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "controlplane.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelectors.controlPlane }}
      nodeSelector:
        {{- include "controlplane.pairsToMap" . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations.controlPlane }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgres
          image: "{{ .Values.postgresImageRepository }}:{{ .Values.postgresVersion }}"
          imagePullPolicy: {{ .Values.postgresImagePullPolicy }}
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-db-insecure-secret
                  key: .user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-db-insecure-secret
                  key: .password
            - name: POSTGRES_DB
              value: feldera
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          resources:
            {{- toYaml .Values.resources.postgres | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      {{- if not .Values.postgresPersistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.postgresPersistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.postgresPersistence.storageClassName }}
        storageClassName: {{ .Values.postgresPersistence.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresPersistence.size }}
  {{- end }}
{{- end }}
