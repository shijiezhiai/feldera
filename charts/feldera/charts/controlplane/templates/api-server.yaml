apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "controlplane.fullname" . }}-api-server
  labels:
    app.kubernetes.io/name: {{ include "controlplane.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api-server
  {{- if .Values.controlPlane.deploymentTimeAnnotation }}
  annotations:
    deployment-time: {{ .Release.Time | quote }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "controlplane.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "controlplane.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api-server
    spec:
      serviceAccountName: {{ include "controlplane.fullname" . }}
      {{- if and (gt (int .Values.replicaCount) 1) (ne .Values.apiServerAntiAffinity "none") }}
      # Spread the replicas over nodes: two replicas on one node fail together,
      # so co-locating them adds no availability and would cost the leader.
      #
      # `required` is the setting for production: it makes a cluster with too
      # few nodes fail loudly instead of quietly co-locating. `preferred` is
      # the default because it still spreads when several nodes exist, and it
      # keeps a single-node development cluster — where two replicas exercise
      # the election rather than the scheduler — from deadlocking with one pod
      # Pending. Neither is a no-op, so `none` exists for the case where an
      # operator spreads the replicas some other way.
      affinity:
        podAntiAffinity:
          {{- if eq .Values.apiServerAntiAffinity "required" }}
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: {{ include "controlplane.name" . }}
                  app.kubernetes.io/instance: {{ .Release.Name }}
                  app.kubernetes.io/component: api-server
          {{- else }}
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: {{ include "controlplane.name" . }}
                    app.kubernetes.io/instance: {{ .Release.Name }}
                    app.kubernetes.io/component: api-server
          {{- end }}
      {{- end }}
      containers:
        - name: api-server
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- if .Values.kubernetesRunner.enabled }}
            # The Kubernetes runner provisions each pipeline as its own pod
            # (see docs/design/adr-k8s-runner.md). Pipelines fetch their program
            # binary from the compiler service in this same pod, so the compiler
            # host must be the in-cluster address, never 127.0.0.1.
            - name: FELDERA_RUNNER
              value: "kubernetes"
            # P1-018: the artifacts live in the compiler StatefulSet, not in
            # this pod, so this process serves the API and the runner only.
            - name: FELDERA_SERVICES
              value: "api"
            - name: COMPILER_HOST
              value: {{ .Values.compilerServiceHost | default (printf "%s-compiler.%s.svc.cluster.local" .Release.Name .Release.Namespace) | quote }}
            {{- end }}
            {{- if gt (int .Values.replicaCount) 1 }}
            # Above one replica, elect exactly one instance to reconcile
            # pipelines. Without this every replica would provision, start and
            # stop every pipeline, and each would tear down the other's
            # deployment.
            - name: FELDERA_LEADER_ELECTION
              value: "true"
            {{- end }}
            {{- if not .Values.postgresExternal }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-db-insecure-secret
                  key: .user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-db-insecure-secret
                  key: .password
            {{- end }}
            {{- if .Values.httpsSecretRef }}
            - name: FELDERA_ENABLE_HTTPS
              value: "true"
            - name: FELDERA_HTTPS_TLS_CERT_PATH
              value: /tls/tls.crt
            - name: FELDERA_HTTPS_TLS_KEY_PATH
              value: /tls/tls.key
            {{- end }}
          # The image ENTRYPOINT already carries --bind-address, --sql-compiler-path,
          # --compilation-cargo-lock-path, --dbsp-override-path and --demos-dir
          # (deploy/Dockerfile.manager); only the DB connection differs per deploy.
          args:
            {{- if .Values.postgresExternal }}
            - "--db-connection-string={{ .Values.felderaDatabaseSecretRef }}"
            {{- else }}
            - "--db-connection-string=postgres://$(DB_USER):$(DB_PASSWORD)@{{ .Release.Name }}-db:{{ .Values.postgresPort }}/feldera"
            {{- end }}
            {{- if .Values.kubernetesRunner.enabled }}
            - "--compiler-host=$(COMPILER_HOST)"
            - "--kubernetes-runner-namespace={{ .Release.Namespace }}"
            - "--kubernetes-runner-pipeline-executor-image={{ .Values.kubernetesRunner.image.registry }}/{{ .Values.kubernetesRunner.image.repository }}:{{ .Values.kubernetesRunner.image.tag }}"
            {{- if .Values.kubernetesRunner.enablePerPipelineNamespace }}
            - "--kubernetes-runner-per-pipeline-namespace"
            {{- end }}
            # P1-019: storage class policy. The allowlist only takes effect with
            # the switch on, and every tenant namespace must already exist.
            {{- if .Values.kubernetesRunner.enableStorageClassNamesSupported }}
            - "--kubernetes-runner-enable-storage-classes"
            {{- with .Values.kubernetesRunner.storageClassNamesSupported }}
            - "--kubernetes-runner-storage-classes={{ join "," . }}"
            {{- end }}
            {{- end }}
            {{- with .Values.kubernetesRunner.storageClassName }}
            - "--kubernetes-runner-storage-class={{ . }}"
            {{- end }}
            {{- with .Values.kubernetesRunner.tenantNamespaces }}
            - "--kubernetes-runner-tenant-namespaces={{ range $tenant, $namespace := . }}tenant={{ $tenant }}:{{ $namespace }},{{ end }}"
            {{- end }}
            {{- if .Values.kubernetesRunner.allowCustomPipelineTemplate }}
            - "--kubernetes-runner-allow-kubernetes-env-prefix"
            {{- end }}
            # Resource range of the platform; the runner clamps every pipeline
            # request into it (P1-011).
            - "--kubernetes-runner-lower-memory-mb={{ .Values.kubernetesRunner.lowerLimitMemoryMegabyte }}"
            - "--kubernetes-runner-upper-memory-mb={{ .Values.kubernetesRunner.upperLimitMemoryMegabyte }}"
            - "--kubernetes-runner-default-storage-mb={{ .Values.kubernetesRunner.defaultStorageMegabyte }}"
            - "--kubernetes-runner-upper-storage-mb={{ .Values.kubernetesRunner.upperLimitStorageMegabyte }}"
            {{- if .Values.kubernetesRunner.metrics.enabled }}
            # P1-015: scrape target per pipeline, labelled feldera.com/metrics-scrape.
            - "--kubernetes-runner-metrics-service"
            {{- with .Values.kubernetesRunner.metrics.namespace }}
            - "--kubernetes-runner-metrics-namespace={{ . }}"
            {{- end }}
            {{- end }}
            {{- with .Values.kubernetesRunner.template.configMap }}
            - "--kubernetes-runner-template-configmap={{ . }}"
            - "--kubernetes-runner-template-key={{ $.Values.kubernetesRunner.template.key }}"
            {{- with $.Values.kubernetesRunner.template.namespace }}
            - "--kubernetes-runner-template-namespace={{ . }}"
            {{- end }}
            {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          {{- if .Values.compilationCache.enabled }}
          volumeMounts:
            # Cargo target directory of the programs compiled inside this pod.
            # A cold compile takes hours, so the claim keeps it across pod
            # recreations.
            - name: compilation-cache
              mountPath: /home/ubuntu/.feldera
          {{- end }}
          resources:
            {{- toYaml .Values.resources.apiServer | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
      {{- if .Values.compilationCache.enabled }}
      # The compilation cache claim is handed to the pod as root:root, but the
      # image runs as `ubuntu` (uid 1000). fsGroup makes the kubelet give the
      # group write access, which is what cargo needs to create its target
      # directory inside the claim.
      securityContext:
        fsGroup: 1000
      volumes:
        - name: compilation-cache
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-compilation-cache
      {{- end }}
      {{- with .Values.controlPlane.env }}
      # NOTE: controlPlane.env (pod-level env) is intentionally not injected
      # here yet; the official chart injects it via a pod template patch that
      # the OSS manager does not need for P1-005.
      {{- end }}
