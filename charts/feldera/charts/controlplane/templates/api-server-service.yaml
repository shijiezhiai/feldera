apiVersion: v1
kind: Service
metadata:
  name: {{ include "controlplane.fullname" . }}-api-server
  labels:
    app.kubernetes.io/name: {{ include "controlplane.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "controlplane.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api-server
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 8080
    {{- if .Values.kubernetesRunner.enabled }}
    # Pipeline pods download their program binary from the compiler service that
    # runs inside the manager pod; without this port the pipeline cannot start.
    - name: compiler
      port: 8085
      targetPort: 8085
    {{- end }}
