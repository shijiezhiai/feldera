{{- if not .Values.postgresExternal }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db-insecure-secret
  labels:
    {{- include "controlplane.labels" . | nindent 4 }}
type: Opaque
stringData:
  .user: {{ .Values.postgresUser | default "feldera" | quote }}
  .password: {{ .Values.postgresPassword | default (randAlphaNum 24) | quote }}
{{- end }}
