{{- if not .Values.postgresExternal }}
{{- /*
The password must survive Helm upgrades. `randAlphaNum` alone would generate a
new value on every render, which silently locks the manager out of a running
Postgres whose data directory already stores the old password. Reuse whatever
the cluster already has; only generate when the Secret does not exist yet.
`helm template` has no cluster to look at, so it still renders a fresh value.
*/ -}}
{{- $secretName := printf "%s-db-insecure-secret" .Release.Name -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $password := .Values.postgresPassword | default "" -}}
{{- if not $password -}}
{{- if and $existing (hasKey $existing.data ".password") -}}
{{- $password = index $existing.data ".password" | b64dec -}}
{{- else -}}
{{- $password = randAlphaNum 24 -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "controlplane.labels" . | nindent 4 }}
type: Opaque
stringData:
  .user: {{ .Values.postgresUser | default "feldera" | quote }}
  .password: {{ $password | quote }}
{{- end }}
