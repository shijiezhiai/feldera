# Control plane values. Key names follow the official enterprise chart
# reference (helm-chart-reference.md) so migration stays mechanical.
# Each component's resources default to the official requests; the kind smoke
# overlays small sizes via --set.

image:
  registry: localhost:5001
  repository: feldera-manager
  tag: "v0.357.0-20-g7a5128651-bili.1"
  pullPolicy: IfNotPresent

# API server replicas. Above one, leader election decides which instance
# reconciles pipelines: the others serve the API and answer log requests with
# 503 until they take over. Leave it at one on a single-node cluster, where a
# second replica costs a pod and adds no availability.
replicaCount: 1

# How the API server replicas are kept apart, once there is more than one.
#
#   preferred - spread over nodes when the cluster has more than one, and fall
#               back to co-locating when it does not (the default)
#   required  - refuse to co-locate, leaving a replica Pending on a cluster
#               with too few nodes; the production setting
#   none      - no rule; for clusters that spread the replicas another way
#
# At one replica none of these apply: there is nothing to keep apart.
apiServerAntiAffinity: preferred

# Interface-compatible no-op fields (OSS manager has no license gate).
felderaAccountId: ""
felderaLicenseKey: ""
cloudSecretRef: ""

# HTTP
service:
  type: ClusterIP
  port: 8080

# --- Database ---------------------------------------------------------------
postgresExternal: false
postgresVersion: "17-alpine"
postgresImageRepository: "postgres"
postgresImagePullPolicy: "IfNotPresent"
postgresPort: 5431
# The control plane keeps pipelines, API keys and audit rows in this database.
# On `emptyDir` those live no longer than the pod: replacing the database pod
# resets the control plane to an empty schema, and because the migrations run
# only at startup, the API then answers every request with
# `relation "pipeline" does not exist`. On is what a real deployment wants; off
# keeps throwaway clusters (kind smoke runs) from leaking a claim each.
postgresPersistence:
  enabled: true
  size: 10Gi
  storageClassName: ""
postgresUser: "feldera"
postgresPassword: ""
felderaDatabaseSecretRef: ""

# --- TLS / logging ----------------------------------------------------------
httpsSecretRef: null
# Emit structured JSON logs instead of formatted text. Required for the audit
# trail to be queryable: `crates/pipeline-manager/src/api/audit.rs` writes one
# event per access decision on the `feldera_audit` target, and a log platform
# can filter those by principal only when each field is its own JSON key.
#
# On by default: an audit trail that is off by default is not an audit trail.
# The format is only a consumer choice, and the platform ingests JSON, so the
# setting that makes the trail queryable is the one that should ship enabled.
logJson: true

# --- Control plane env --------------------------------------------------------
controlPlane:
  env: []
  deploymentTimeAnnotation: true

# Persistent cargo target directory of the in-pod compiler. Enable it in
# environments with a default StorageClass to keep pipeline compilation warm
# across pod recreations; `scripts/e2e-k8s-runner.sh` leaves it off because the
# claim outlives throwaway clusters otherwise.
compilationCache:
  enabled: false
  size: 50Gi
  storageClassName: ""

kubernetesRunner:
  # P1-009: runs each pipeline as its own StatefulSet-managed pod. Disabling it
  # falls back to the local (in-pod) runner, which is only useful for debugging.
  enabled: true
  image:
    registry: localhost:5001
    repository: feldera-runner
    tag: "v0.357.0-20-g7a5128651-bili.1"
  enablePerPipelineNamespace: false
  allowCustomPipelineTemplate: false
  lowerLimitMemoryMegabyte: 100
  upperLimitMemoryMegabyte: 32000
  defaultStorageMegabyte: 30000
  upperLimitStorageMegabyte: 128000
  lowerLimitEphemeralStorageMegabyte: 500
  upperLimitEphemeralStorageMegabyte: 2000
  # Class the platform provisions pipeline state on. Null means the cluster's
  # default class.
  storageClassName: null
  # P1-019: refuse a pipeline that asks for a class outside this list, so a
  # pipeline cannot land its state on a class that cannot survive an eviction.
  # An empty list with the switch on refuses every named class, which is
  # deliberate: "these are the classes we allow" with none listed allows none.
  enableStorageClassNamesSupported: false
  storageClassNamesSupported: []
  # P1-019: namespace per tenant, written as "<tenant-uuid>: <namespace>".
  # Every namespace must exist before it is listed here: the manager's role is
  # namespaced and cannot create one.
  tenantNamespaces: {}
  # P1-022: what a tenant's namespace may hold, written as
  # "<tenant-uuid>: <namespace>: <key>=<value>,...". A tenant listed here takes
  # its namespace from this entry, and the API server keeps that namespace, its
  # ResourceQuota and its LimitRange in step with the tenant.
  #
  # The keys are the quota's resource names (requests.cpu, requests.memory,
  # limits.cpu, limits.memory, persistentvolumeclaims, requests.storage) and the
  # LimitRange defaults (default.cpu, default.memory, defaultRequest.cpu,
  # defaultRequest.memory, max.cpu, max.memory).
  #
  #   tenantQuotas:
  #     "0193d7c2-...": "acme: requests.cpu=16,requests.memory=32Gi,limits.cpu=4"
  tenantQuotas: {}
  # P1-022: let the API server create, label and delete tenant namespaces.
  # Needs a cluster-scoped grant, which the runner's namespaced Role cannot
  # give: this switch adds exactly a ClusterRole over namespaces, quotas and
  # limit ranges. Off, every namespace in tenantQuotas must exist already and
  # deleting a tenant leaves its namespace behind.
  tenantNamespaceAutomation: false
  # P1-025: which Kubernetes Secrets a pipeline configuration may reference
  # through `${secret:kubernetes:<name>/<key>}`.
  #
  # Off by default, and off means *no* connector may reference a Secret at all.
  # The permissive reading — "off means no enforcement" — is the one that leaks:
  # a pipeline's configuration is writable by anyone who can change a pipeline
  # in that tenant, and a reference resolves to whatever the pipeline pod may
  # read, so an unenforced list turns any tenant member into a reader of every
  # Secret in the namespace.
  #
  # The list names Secrets, not (Secret, key) pairs: a reference may use any key
  # of a listed Secret, and only the keys the configuration actually uses are
  # projected into the pod. Keep unrelated credentials in separate Secrets.
  #
  #   connectorKubernetesSecrets:
  #     enableAllowlist: true
  #     allowlist: ["kafka-creds", "s3-credentials"]
  connectorKubernetesSecrets:
    enableAllowlist: false
    allowlist: []
  # P1-015: expose one ClusterIP Service per pipeline, labelled for a scrape
  # job, and admit the namespace below on the pipeline port. Off by default
  # because it adds an object and a policy peer per pipeline.
  metrics:
    enabled: false
    # Namespace of the scrape client. Empty means the manager namespace, which
    # is the common case for a monitoring stack in the same release namespace.
    namespace: ""
  template:
    # Name of an existing ConfigMap that holds a StatefulSet template for
    # pipeline pods (P1-011). Empty means the runner renders its built-in
    # StatefulSet. See docs/design/p1-011-pipeline-template.md for the
    # placeholder reference and an example template.
    configMap: ""
    # Key of the template inside that ConfigMap.
    key: pipelineTemplate
    # Namespace of the ConfigMap; empty means the release namespace.
    namespace: ""
  # Scheduling and pull credentials for the pipeline pods the manager creates.
  #
  # These are not the manager's own settings: each pipeline is a separate pod
  # in a namespace the manager may not even run in, and Kubernetes does not
  # inherit any of this from the pod that created it. A cluster that taints the
  # nodes a workload may run on, or that serves images from a registry needing
  # credentials, therefore has to say so here as well.
  #
  # Every list is a list of strings because the manager takes them as flags:
  # `key=value` for the selector and the labels, `key=value` for an annotation,
  # and a Secret name for a pull secret.
  pod:
    # Node selector for pipeline pods, e.g. `["workload=streaming"]`.
    nodeSelector: []
    # Tolerations for pipeline pods, as Kubernetes toleration maps, e.g.
    # `- key: workload
    #    operator: Equal
    #    value: streaming
    #    effect: NoSchedule`
    tolerations: []
    # Image pull secrets, e.g. `["hub-pull"]`.
    imagePullSecrets: []
    # Extra labels and annotations, e.g. `["team=streaming"]`. A label that
    # repeats one the runner sets is refused: it uses those to find the objects.
    labels: []
    annotations: []

compilerPvcStorageSize: 20Gi
compilationProfile: optimized
compilerServer:
  cargo:
    config: null
  serviceAccountAnnotations: []

parallelCompilation:
  enabled: false
  replicas: 1

auth:
  enabled: false
  provider: aws-cognito
  clientId: ""
  issuer: ""
  cognitoLoginUrl: ""
  cognitoLogoutUrl: ""
# Platform owners, comma-joined into FELDERA_OWNERS. Each entry matches a
# provider-verified email, a bare OIDC subject, or "<issuer> <subject>".
owners: []
authorization:
  individualTenant: null
  issuerTenant: null
  authorizedGroups: null
  # Identity-provider group name to the role it grants, rendered into
  # FELDERA_AUTH_GROUP_ROLE_MAPS as JSON. A user holding several mapped groups
  # gets the highest. A mapped group also admits the login, so a group map
  # alone is enough to restrict the platform to mapped groups.
  #
  #   groupRoleMaps:
  #     platform-admins: admin
  #     data-engineers: write
  #     analysts: read
  #
  # 'owner' is rejected at startup: like `owners`, it is configuration only.
  groupRoleMaps: null
  authAudience: null

allowedOrigins: null
posthogTelemetryKey: null
demos:
  showDefault: true
  configMapRef: null

pipeline:
  serviceAccountName: null
  env: null
  allowInitContainers: true
  allowProfiling: false

# Resources. Defaults = official; kind smoke overlays smaller via --set.
resources:
  postgres:
    requests:
      cpu: "1"
      memory: "512Mi"
  apiServer:
    requests:
      cpu: "500m"
      memory: "1Gi"
  compilerServer:
    requests:
      cpu: "1"
      memory: "4Gi"
  kubernetesRunner:
    requests:
      cpu: "500m"
      memory: "512Mi"

# Scheduling and pull credentials. Each `controlPlane` entry applies to the
# pods Helm renders — the API server and the database; the compiler subchart has
# its own copy, because a subchart cannot read its sibling's values. Each
# `pipeline` entry applies to the pods the manager renders, and reaches them as
# the `--kubernetes-runner-pod-*` flags.
#
# These keys existed since the chart was written but no template read them, so
# setting them changed nothing. Bilibili's clusters label and taint the nodes a
# workload may land on, and their registry needs credentials, so a deployment
# there cannot be a deployment without them.
#
# The pipeline pod is rendered by the manager, not by Helm, which is why its
# settings have to travel as flags. `kubernetesRunner.pod` is the documented
# place for them; the `pipeline` keys below are honoured only when it is empty,
# and the two are never merged (two lists of `key=value` cannot be combined
# without guessing which duplicate wins).
nodeSelectors:
  # `kubernetes.io/os: linux` or `["workload=control-plane"]`.
  controlPlane: []
  # For pipeline pods: a list of `key=value` strings, because the manager takes
  # them as a flag.
  pipeline: []
# Kubernetes tolerations (a list of maps) for rendered pods; `[{key, operator,
# value, effect}]` for pipeline pods, sent as JSON.
tolerations:
  controlPlane: []
  pipeline: []
# Extra labels and annotations on the control-plane pods; on the pipeline pods
# they are added to the runner's own labels, and a key the runner owns is
# refused rather than silently shadowed.
labels:
  controlPlane: []
  pipeline: []
annotations:
  controlPlane: []
  pipeline: []
# Secrets the rendered pods pull with, as `[{name: hub-pull}]`. These do not
# reach the pipeline pods: the manager does not pass its own pull secrets down,
# so a private registry like Bilibili's needs the name repeated under
# `kubernetesRunner.pod.imagePullSecrets`.
imagePullSecrets: []

ipFamilyPolicy: null
enableIPv6: false
enableStatefulSetServiceName: true
unstableFeatures: []
felderaSentryEnabled: false
cloudApiEndpoint: "https://cloud1.feldera.com"
disableClusterMonitorResources: false
