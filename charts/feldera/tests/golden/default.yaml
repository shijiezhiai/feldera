# Source: feldera/charts/compiler/templates/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: feldera-compiler
  labels:
    app.kubernetes.io/name: compiler
    app.kubernetes.io/instance: feldera
spec:
  serviceName: feldera-compiler
  replicas: 1
  # Roll the pod when its template changes. A StatefulSet defaults to
  # `OnDelete`, so `helm upgrade --set compiler.image.tag=...` leaves the pod
  # running the previous image while the release reports the new one: the tag
  # `helm get values` shows and the tag the pod actually runs disagree, and
  # every later check reads the wrong version.
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: compiler
      app.kubernetes.io/instance: feldera
  template:
    metadata:
      labels:
        app.kubernetes.io/name: compiler
        app.kubernetes.io/instance: feldera
    spec:
      serviceAccountName: feldera-compiler
      containers:
        - name: compiler
          image: "localhost:5001/feldera-compiler:v0.357.0-20-g7a5128651-bili.1"
          imagePullPolicy: IfNotPresent
          # P1-018: the compiler pod compiles and stores artifacts; the API
          # server pod has neither the source tree nor the cargo cache and
          # reaches this one over HTTP at `compilerServiceHost`.
          #
          # `artifact-server` alone runs the store without compiling, which is
          # the shape to scale out later: N stateless compilers uploading to
          # one durable store (the enterprise compiler-autoscaling topology
          # `artifact_server_main` was written for).
          env:
            - name: FELDERA_SERVICES
              value: "compiler,artifact-server"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: feldera-db-insecure-secret
                  key: .user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: feldera-db-insecure-secret
                  key: .password
          # The image ENTRYPOINT already carries --bind-address,
          # --sql-compiler-path, --compilation-cargo-lock-path,
          # --dbsp-override-path and --demos-dir; only the per-deployment
          # arguments are passed here.
          args:
            - "--db-connection-string=postgres://$(DB_USER):$(DB_PASSWORD)@feldera-db:5431/feldera"
            - "--compilation-profile=optimized"
          ports:
            - name: compiler
              containerPort: 8085
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8085
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: workspace
              mountPath: /home/ubuntu/.feldera/compiler
      # The claim is handed to the pod as root:root but the image runs as
      # `ubuntu` (uid 1000); fsGroup gives that user write access, which the
      # compiler needs to create its working directory inside the claim.
      securityContext:
        fsGroup: 1000
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: feldera-compiler
---
# Source: feldera/charts/controlplane/templates/db.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: feldera-db
  labels:
    app.kubernetes.io/name: controlplane
    app.kubernetes.io/instance: feldera
    app.kubernetes.io/part-of: feldera
spec:
  serviceName: feldera-db
  replicas: 1
  # See the compiler StatefulSet: `OnDelete` (the default) leaves the old pod
  # running while Helm reports the new image, which is how a `postgres:16` pod
  # survived an upgrade to `postgres:17` and kept failing to pull.
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/instance: feldera
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/instance: feldera
    spec:
      serviceAccountName: feldera-controlplane
      containers:
        - name: postgres
          image: "postgres:17-alpine"
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: feldera-db-insecure-secret
                  key: .user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: feldera-db-insecure-secret
                  key: .password
            - name: POSTGRES_DB
              value: feldera
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
