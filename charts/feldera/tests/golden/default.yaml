# Source: feldera/charts/controlplane/templates/api-server.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feldera-controlplane-api-server
  labels:
    app.kubernetes.io/name: controlplane
    app.kubernetes.io/instance: feldera
    app.kubernetes.io/component: api-server
  annotations:
    deployment-time: 
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: controlplane
      app.kubernetes.io/instance: feldera
      app.kubernetes.io/component: api-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: controlplane
        app.kubernetes.io/instance: feldera
        app.kubernetes.io/component: api-server
    spec:
      serviceAccountName: feldera-controlplane
      containers:
        - name: api-server
          image: "localhost:5001/feldera-manager:v0.357.0-20-g7a5128651-bili.1"
          imagePullPolicy: IfNotPresent
          env:
            # The Kubernetes runner provisions each pipeline as its own pod
            # (see docs/design/adr-k8s-runner.md). Pipelines fetch their program
            # binary from the compiler service in this same pod, so the compiler
            # host must be the in-cluster address, never 127.0.0.1.
            - name: FELDERA_RUNNER
              value: "kubernetes"
            # P1-018: the artifacts live in the compiler StatefulSet, not in
            # this pod, so this process serves the API and the runner only.
            - name: FELDERA_SERVICES
              value: "api"
            - name: COMPILER_HOST
              value: "feldera-compiler.feldera.svc.cluster.local"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: feldera-db-insecure-secret
                  key: .user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: feldera-db-insecure-secret
                  key: .password
          # The image ENTRYPOINT already carries --bind-address, --sql-compiler-path,
          # --compilation-cargo-lock-path, --dbsp-override-path and --demos-dir
          # (deploy/Dockerfile.manager); only the DB connection differs per deploy.
          args:
            - "--db-connection-string=postgres://$(DB_USER):$(DB_PASSWORD)@feldera-db:5431/feldera"
            - "--compiler-host=$(COMPILER_HOST)"
            - "--kubernetes-runner-namespace=feldera"
            - "--kubernetes-runner-pipeline-executor-image=localhost:5001/feldera-runner:v0.357.0-20-g7a5128651-bili.1"
            # P1-019: storage class policy. The allowlist only takes effect with
            # the switch on, and every tenant namespace must already exist.
            # Resource range of the platform; the runner clamps every pipeline
            # request into it (P1-011).
            - "--kubernetes-runner-lower-memory-mb=100"
            - "--kubernetes-runner-upper-memory-mb=32000"
            - "--kubernetes-runner-default-storage-mb=30000"
            - "--kubernetes-runner-upper-storage-mb=128000"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
