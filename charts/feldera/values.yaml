# Helm umbrella chart. All values are folded into the subcharts; see
# charts/controlplane/values.yaml and charts/compiler/values.yaml.

controlplane:
  enabled: true
  image:
    registry: localhost:5001
    repository: feldera-manager
    tag: "v0.357.0-20-g7a5128651-bili.1"
    pullPolicy: IfNotPresent
  replicaCount: 1
  # P1-019: which storage classes pipelines may use. An empty list with the
  # switch on refuses every named class.
  kubernetesRunner:
    enableStorageClassNamesSupported: false
    storageClassNamesSupported: []
    storageClassName: null
    tenantNamespaces: {}
    # P1-022: per-tenant quotas, and whether the platform may create and delete
    # the namespaces they live in. See controlplane/values.yaml.
    tenantQuotas: {}
    tenantNamespaceAutomation: false
    # P1-025: Kubernetes Secrets a pipeline configuration may reference. Off,
    # no reference is allowed. See controlplane/values.yaml.
    connectorKubernetesSecrets:
      enableAllowlist: false
      allowlist: []
  postgresExternal: false
  postgresVersion: "17-alpine"
  postgresImageRepository: "postgres"
  postgresImagePullPolicy: "IfNotPresent"
  postgresPort: 5431
  postgresUser: "feldera"
  postgresPassword: ""
  felderaDatabaseSecretRef: ""
  httpsSecretRef: null
  # Structured JSON logs; required for the audit trail to be queryable.
  # See charts/controlplane/values.yaml for why this defaults to on.
  logJson: true
  # P1-021: OIDC sign-in for the web console. The manager reads the client id
  # and issuer from the environment and refuses to start without them, so
  # `enabled: true` with an empty issuer fails at pod start, not at login.
  auth:
    enabled: false
    provider: aws-cognito
    clientId: ""
    issuer: ""
    cognitoLoginUrl: ""
    cognitoLogoutUrl: ""
  # Platform owners, comma-joined into FELDERA_OWNERS. Each entry matches a
  # provider-verified email, a bare OIDC subject, or "<issuer> <subject>".
  owners: []
  authorization:
    individualTenant: null
    issuerTenant: null
    authorizedGroups: null
    authAudience: null
  controlPlane:
    env: []
    deploymentTimeAnnotation: true
  resources:
    postgres:
      requests:
        cpu: "1"
        memory: "512Mi"
    apiServer:
      requests:
        cpu: "500m"
        memory: "1Gi"
    compilerServer:
      requests:
        cpu: "1"
        memory: "4Gi"
    kubernetesRunner:
      requests:
        cpu: "500m"
        memory: "512Mi"

compiler:
  enabled: true
  image:
    registry: localhost:5001
    repository: feldera-compiler
    tag: "v0.357.0-20-g7a5128651-bili.1"
    pullPolicy: IfNotPresent
  compilerPvcStorageSize: 20Gi
  compilationProfile: optimized
  compileInThisPod: true
  parallelCompilation:
    replicas: 1
  resources:
    requests:
      cpu: "1"
      memory: "4Gi"
